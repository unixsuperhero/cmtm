[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmtm"
version = "0.1.0"
description = "Clean-room terminal management on an explicitly isolated TUIOS server"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cmtm = "cmtm.cli:main"

[tool.setuptools]
packages = ["cmtm"]
